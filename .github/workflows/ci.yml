name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Site checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-drafts.mjs
      - run: node scripts/check-routes.mjs
      - run: node scripts/check-structure.mjs
      - run: node scripts/check-links.mjs

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Serve the site
        run: npx --yes http-server . -p 8080 --silent &
      - name: Wait for server
        run: npx --yes wait-on http://localhost:8080
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          # Representative pages, not all 88: the homepage (heaviest hero/JS),
          # a diagnostic (interactive JS-driven), and the dataset page (largest
          # DOM on the site). Widen this list if a category regresses somewhere
          # else and needs a permanent watch.
          urls: |
            http://localhost:8080/
            http://localhost:8080/tools/genai-readiness.html
            http://localhost:8080/dataset/
          numberOfRuns: 3
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./.github/lighthouserc.json
          # Real gate, not informational — see .github/lighthouserc.json.
          #
          # First run (single sample): perf 82-94, a11y 91-96, best-
          # practices/seo 100. Second run, same code: perf 62-77 — a ~20-point
          # swing from nothing but CI-runner noise. A single Lighthouse
          # Performance run on a shared/throttled runner is not trustworthy;
          # numberOfRuns:3 takes the median across three runs per URL instead,
          # which is the standard mitigation. Performance is still gated low
          # (0.55) below even the noisy floor already observed, since three
          # runs narrows variance but doesn't erase runner contention.
          # Accessibility was stable across both runs (91-96), so it keeps a
          # real margin at 0.85. `pwa` is excluded on purpose: this site has
          # no manifest or service worker and isn't becoming a PWA, so a 38
          # there is expected, not a regression.
