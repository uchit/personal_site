name = "hellouchit-chat"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Workers AI — free tier: 10,000 neurons/day. Llama 3.1 8B costs roughly
# ~50-300 neurons per request depending on prompt/response length, so this
# comfortably covers real personal-site traffic before any billing kicks in.
[ai]
binding = "AI"

# Per-IP daily rate limit counters. Free tier: 100k reads + 1k writes per day
# — this feature will hit the write cap long before it costs anything, which
# is the point: it's the abuse backstop, not a metering system.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[observability]
enabled = true
