name = "hellouchit-site"
main = "src/index.js"
compatibility_date = "2026-01-01"

# One Worker for the site's backend, on the existing hellouchit.com/v1/* route:
#   /v1/submit, /v1/stats  opt-in diagnostic benchmark (D1 tallies)
#   /v1/mcp                read-only MCP server for AI assistants (no bindings)
#
# The "Ask this site" chat (/v2/chat) and its Workers AI and KV bindings were
# retired in November 2026. The KV namespace and the hellouchit.com/v2/* route
# still exist in Cloudflare and can be removed from the dashboard.

# Created with: npx wrangler d1 create hellouchit-benchmark
# The binding stays DB (src/index.js reads env.DB).
[[d1_databases]]
binding = "DB"
database_name = "hellouchit-benchmark"
database_id = "dc170294-9788-45b4-82ac-cd5da52d25fd"

[observability]
enabled = true
