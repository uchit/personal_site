<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<!-- noindex: intentional. Template for per-page social images; see docs/deploying.md. -->
<title>OG image template</title>
<style>
  html, body { margin: 0; background: #000; }
  .card {
    width: 1200px; height: 630px; box-sizing: border-box; padding: 72px 80px;
    background: #000; color: #f5f5f7; position: relative; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    display: grid; grid-template-columns: 1fr auto; grid-template-rows: 1fr auto; column-gap: 56px;
  }
  .title { grid-column: 1; align-self: center; font-size: 60px; line-height: 1.04; letter-spacing: -0.035em; font-weight: 600; max-width: 13em; }
  .fig { grid-column: 2; grid-row: 1; align-self: center; text-align: right; }
  .fig b {
    display: block; font-size: 168px; line-height: .86; letter-spacing: -0.06em; font-weight: 600; white-space: nowrap;
    background: linear-gradient(180deg, #fff 0%, #d2d2d7 55%, #8e8e93 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .fig b sup { font-size: .42em; vertical-align: .95em; }
  .fig b small { font-size: .32em; letter-spacing: -0.03em; }
  .fig span { display: block; margin-top: 18px; font-size: 26px; color: #a1a1a6; }
  .foot { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; padding-top: 28px; border-top: 1px solid #2c2c2e; font-size: 24px; color: #a1a1a6; }
  .foot b { color: #f5f5f7; font-weight: 600; }
  .photo { grid-column: 2; grid-row: 1; align-self: center; width: 330px; height: 400px; border-radius: 24px; overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 70% 25%; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="title" id="t"></div>
  <div class="fig" id="f"></div>
  <div class="foot"><span><b>Uchit Vyas</b>, lead forward deployed engineer</span><span>hellouchit.com</span></div>
</div>
<script>
  /* Filled from the query string: ?t=title&f=figure-html&c=caption&p=photo */
  var q = new URLSearchParams(location.search);
  document.getElementById("t").textContent = q.get("t") || "";
  var f = document.getElementById("f");
  if (q.get("p")) {
    f.className = "photo";
    var img = document.createElement("img"); img.src = q.get("p"); img.alt = ""; f.appendChild(img);
  } else {
    var b = document.createElement("b"); b.innerHTML = q.get("f") || ""; f.appendChild(b);
    var s = document.createElement("span"); s.textContent = q.get("c") || ""; f.appendChild(s);
  }
</script>
</body>
</html>
